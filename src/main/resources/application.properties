
spring.application.name=credshield

# ===================================
# DATABASE CONFIGURATION
# ===================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/credshield}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA CONFIGURATION
# ===================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================
# JWT CONFIGURATION
# ===================================

jwt.secret=${JWT_SECRET}

# ===================================
# LOGGING CONFIGURATION
# ===================================

logging.level.root=INFO
logging.level.com.credshield.credshield=INFO
logging.level.org.hibernate.SQL=INFO

logging.file.name=logs/credshield.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ===================================
# SWAGGER CONFIGURATION
# ===================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
